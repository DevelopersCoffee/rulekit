name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --all
      - name: Golden rule fixtures
        run: cargo test -p dc_rulekit --test schema_golden

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: packages/dc_rulekit
      - run: dart analyze
        working-directory: packages/dc_rulekit
      - run: dart test
        working-directory: packages/dc_rulekit
